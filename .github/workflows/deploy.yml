name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Custom domain crystalbasket.store is attached (N07), so the site lives at the root.
      NEXT_PUBLIC_BASE_PATH: ""
      # Shopify Storefront (N11). Public (client-side) token and domain are repo variables. Both empty = WhatsApp/payment-link mode.
      NEXT_PUBLIC_SHOPIFY_DOMAIN: ${{ vars.SHOPIFY_DOMAIN }}
      NEXT_PUBLIC_SHOPIFY_STOREFRONT_TOKEN: ${{ vars.SHOPIFY_STOREFRONT_PUBLIC_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: sitemap lastmod and "Last reviewed" dates come from git log.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @crystal-basket/catalog test
      - run: pnpm --filter web build
      - run: touch apps/web/out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  indexnow:
    # Tell Bing, Yandex, Seznam and other IndexNow engines that pages changed. The key file lives in apps/web/public.
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Ping IndexNow with every sitemap URL
        env:
          KEY: 111d836f4189ab2274f0b929c3e43b99
          HOST: crystalbasket.store
        run: |
          sleep 60
          urls=$(curl -fsSL "https://$HOST/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed -e 's/<loc>//' -e 's#</loc>##' | jq -R . | jq -sc .)
          body=$(jq -nc --arg host "$HOST" --arg key "$KEY" --argjson urls "$urls" '{host:$host,key:$key,keyLocation:("https://"+$host+"/"+$key+".txt"),urlList:$urls}')
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$body")
          echo "IndexNow responded $code"
          case "$code" in 200|202) ;; *) echo "::warning::IndexNow returned $code" ;; esac
